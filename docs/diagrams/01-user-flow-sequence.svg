<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">CrimeMatrix — Investigation User Flow</title>
  <desc id="desc">White-theme sequence-style user flow from officer query to intelligence response</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .frame { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
      .ink { fill: #0f172a; }
      .muted { fill: #64748b; }
      .line { stroke: #cbd5e1; stroke-width: 1.5; }
      .lifeline { stroke: #e2e8f0; stroke-width: 2; stroke-dasharray: 6 8; }
      .msg { stroke: #0f172a; stroke-width: 1.75; fill: none; marker-end: url(#arrow); }
      .msg-ret { stroke: #64748b; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow-muted); }
      .accent { fill: #f59e0b; }
      .accent-soft { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; }
      .actor { fill: #ffffff; stroke: #0f172a; stroke-width: 2; }
      .actor-fill { fill: #0f172a; }
      .box { fill: #ffffff; stroke: #0f172a; stroke-width: 1.75; }
      .box-ai { fill: #fffbeb; stroke: #d97706; stroke-width: 1.75; }
      .label { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 15px; fill: #0f172a; }
      .label-sm { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 13px; fill: #475569; }
      .title { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 16px; fill: #64748b; }
      .badge { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #92400e; letter-spacing: 0.06em; }
      .step { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
      .note { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 12px; fill: #475569; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#0f172a"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1920" height="1080"/>

  <!-- Header -->
  <rect class="accent" x="72" y="48" width="48" height="6" rx="3"/>
  <text class="badge" x="72" y="82">CRIMEMATRIX  ·  USER FLOW</text>
  <text class="title" x="72" y="128">Investigation Copilot Sequence</text>
  <text class="subtitle" x="72" y="158">Officer ’ Slate UI ’ Backend AppSail ’ AI AppSail ’ LLM ’ Data Store</text>

  <!-- Swimlane header cards -->
  <!-- Officer -->
  <g transform="translate(140,200)">
    <rect class="actor" width="160" height="64" rx="10"/>
    <circle cx="36" cy="32" r="14" class="actor-fill"/>
    <text x="36" y="36" text-anchor="middle" class="step" font-size="11">IO</text>
    <text class="label" x="62" y="30" font-weight="600">Investigating</text>
    <text class="label" x="62" y="48" font-weight="600">Officer</text>
  </g>
  <!-- Frontend -->
  <g transform="translate(420,200)">
    <rect class="box" width="160" height="64" rx="10"/>
    <text class="label" x="80" y="28" text-anchor="middle" font-weight="700">Slate Frontend</text>
    <text class="label-sm" x="80" y="48" text-anchor="middle">React + Vite</text>
  </g>
  <!-- Backend -->
  <g transform="translate(700,200)">
    <rect class="box" width="160" height="64" rx="10"/>
    <text class="label" x="80" y="28" text-anchor="middle" font-weight="700">Backend API</text>
    <text class="label-sm" x="80" y="48" text-anchor="middle">FastAPI AppSail</text>
  </g>
  <!-- AI -->
  <g transform="translate(980,200)">
    <rect class="box-ai" width="160" height="64" rx="10"/>
    <text class="label" x="80" y="28" text-anchor="middle" font-weight="700">AI Services</text>
    <text class="label-sm" x="80" y="48" text-anchor="middle">Agent + Tools</text>
  </g>
  <!-- LLM -->
  <g transform="translate(1260,200)">
    <rect class="box" width="160" height="64" rx="10"/>
    <text class="label" x="80" y="28" text-anchor="middle" font-weight="700">LLM Provider</text>
    <text class="label-sm" x="80" y="48" text-anchor="middle">OpenRouter / Gemini</text>
  </g>
  <!-- Data -->
  <g transform="translate(1540,200)">
    <rect class="box" width="180" height="64" rx="10"/>
    <text class="label" x="90" y="28" text-anchor="middle" font-weight="700">Catalyst Store</text>
    <text class="label-sm" x="90" y="48" text-anchor="middle">Data + File Store</text>
  </g>

  <!-- Lifelines -->
  <line class="lifeline" x1="220" y1="274" x2="220" y2="980"/>
  <line class="lifeline" x1="500" y1="274" x2="500" y2="980"/>
  <line class="lifeline" x1="780" y1="274" x2="780" y2="980"/>
  <line class="lifeline" x1="1060" y1="274" x2="1060" y2="980"/>
  <line class="lifeline" x1="1340" y1="274" x2="1340" y2="980"/>
  <line class="lifeline" x1="1630" y1="274" x2="1630" y2="980"/>

  <!-- Step 1 -->
  <circle cx="72" cy="330" r="14" class="accent"/>
  <text class="step" x="72" y="335" text-anchor="middle">1</text>
  <line class="msg" x1="220" y1="330" x2="490" y2="330"/>
  <text class="label-sm" x="355" y="318" text-anchor="middle">Ask: Similar robbery cases near MG Road?</text>

  <!-- Step 2 -->
  <circle cx="72" cy="400" r="14" class="accent"/>
  <text class="step" x="72" y="405" text-anchor="middle">2</text>
  <line class="msg" x1="500" y1="400" x2="770" y2="400"/>
  <text class="label-sm" x="635" y="388" text-anchor="middle">POST /api/v1/copilot/chat</text>

  <!-- Step 3 -->
  <circle cx="72" cy="470" r="14" class="accent"/>
  <text class="step" x="72" y="475" text-anchor="middle">3</text>
  <line class="msg" x1="780" y1="470" x2="1050" y2="470"/>
  <text class="label-sm" x="915" y="458" text-anchor="middle">POST /api/ai/chat  (proxy)</text>

  <!-- Step 4 plan -->
  <circle cx="72" cy="540" r="14" class="accent"/>
  <text class="step" x="72" y="545" text-anchor="middle">4</text>
  <line class="msg" x1="1060" y1="540" x2="1330" y2="540"/>
  <text class="label-sm" x="1195" y="528" text-anchor="middle">Plan tool steps (search / graph / predict)</text>
  <line class="msg-ret" x1="1330" y1="565" x2="1060" y2="565"/>
  <text class="note" x="1195" y="580" text-anchor="middle">Structured plan returned</text>

  <!-- Step 5 tools + data -->
  <circle cx="72" cy="640" r="14" class="accent"/>
  <text class="step" x="72" y="645" text-anchor="middle">5</text>
  <line class="msg" x1="1060" y1="640" x2="780" y2="640"/>
  <text class="label-sm" x="920" y="628" text-anchor="middle">Tool calls ’ crime_search / stats</text>
  <line class="msg" x1="780" y1="680" x2="1620" y2="680"/>
  <text class="label-sm" x="1200" y="668" text-anchor="middle">Phase-1 Data Store read (ZCQL / rows)</text>
  <line class="msg-ret" x1="1620" y1="710" x2="780" y2="710"/>
  <text class="note" x="1200" y="725" text-anchor="middle">Cases, crimes, districts, suspects</text>

  <!-- Step 6 synthesize -->
  <circle cx="72" cy="780" r="14" class="accent"/>
  <text class="step" x="72" y="785" text-anchor="middle">6</text>
  <line class="msg" x1="1060" y1="780" x2="1330" y2="780"/>
  <text class="label-sm" x="1195" y="768" text-anchor="middle">Generate grounded answer + reasoning</text>
  <line class="msg-ret" x1="1330" y1="810" x2="1060" y2="810"/>

  <!-- Step 7 return -->
  <circle cx="72" cy="870" r="14" class="accent"/>
  <text class="step" x="72" y="875" text-anchor="middle">7</text>
  <line class="msg-ret" x1="1060" y1="870" x2="780" y2="870"/>
  <line class="msg-ret" x1="780" y1="900" x2="500" y2="900"/>
  <line class="msg-ret" x1="500" y1="930" x2="220" y2="930"/>
  <text class="label-sm" x="640" y="888" text-anchor="middle">SSE / JSON response with citations</text>
  <text class="label-sm" x="360" y="948" text-anchor="middle">Officer sees answer, map, similar cases</text>

  <!-- Bottom legend -->
  <rect class="frame" x="72" y="990" width="1776" height="56" rx="10"/>
  <line class="msg" x1="110" y1="1018" x2="180" y2="1018"/>
  <text class="note" x="195" y="1022">Request</text>
  <line class="msg-ret" x1="320" y1="1018" x2="390" y2="1018"/>
  <text class="note" x="405" y="1022">Response</text>
  <rect class="accent-soft" x="560" y="1004" width="18" height="18" rx="3"/>
  <text class="note" x="590" y="1018">AI decision / generation step</text>
  <text class="note" x="980" y="1018">Alternate paths: Maps · Hotspots · Graph · Suspect Risk · Priorities follow the same Backend ’ Store pattern</text>
</svg>
